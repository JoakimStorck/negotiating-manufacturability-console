[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "am-order"
dynamic = ["version"]                       # one place: am_order/__init__.py
description = "The order tool: a product's requirements by Pahl & Beitz, Ulrich & Eppinger and ISO/IEC/IEEE 29148, bound to a design's features"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "openpyxl==3.1.5",
    "python-multipart==0.0.33",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[project.scripts]
am-order = "am_order.cli:main"

[tool.setuptools.dynamic]
version = {attr = "am_order.__version__"}

[tool.setuptools.packages.find]
include = ["am_order*"]

[tool.setuptools.package-data]
am_order = ["schemas/*.json", "vocab/*.json", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
