# The tests on the three platforms the tool is to run on, at every push. The Python range is pyproject.toml's.
# A failing test is also written as an annotation, so that the failure can be read without the log; a test that hangs
# has its stack dumped by pytest's faulthandler after 90 s, and the job stops after twelve minutes.
name: tests
on: [push, pull_request]
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - shell: bash
        run: |
          code=0
          python -m pytest -q -rfE -o faulthandler_timeout=90 > pytest.txt 2>&1 || code=$?
          cat pytest.txt
          exit $code
      - if: always()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " pytest.txt | head -20 | sed 's/^/::error title=pytest::/'
          grep -nE "^E |Timeout|^  File \"" pytest.txt | head -30 | sed 's/^/::error title=detail::/'
          true
