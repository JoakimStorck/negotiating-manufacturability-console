# The tests on the three platforms the tool is to run on, at every push. The Python range is pyproject.toml's.
# A failing test is also written as an annotation, so that the failure can be read without the log.
name: tests
on: [push, pull_request]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE 2>&1 | tee pytest.txt
      - if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " pytest.txt | head -40 | sed 's/^/::error title=pytest::/'
          grep -E "^E " pytest.txt | head -60 | sed 's/^/::error title=detail::/'
